; llama-server router-mode presets for the Nemotron-3 models this repo
; deploys on node-1/node-2, mirroring tuned/nemo.sh's current
; systemd --user unit settings (see write_unit() there) as of commit
; 5b936ecae. See docs/preset.md and tools/server/README.md's "Model
; presets" section for the format.
;
; nemo.sh still drives the live deployment today -- one llama-server
; process per model, each on its own port, no router involved. This file
; is the native llama-server equivalent for anyone who wants a single
; router-mode instance instead (`llama-server --models-preset tuned/models.ini`).
; host/port/alias are router-controlled and intentionally left out here
; (they'd be overwritten on load anyway) -- the section name below is the
; router-addressable model identifier in that mode.
;
; Model paths are inferred from models/aliases.json's search_paths (all
; nemotron-3-* GGUFs are expected under ~/models/nemotron3-gguf on this
; deployment) -- unlike aliases.json, this format has no multi-path
; fallback, so VERIFY the path per host before use.
;
; NOTE (2026-09-04): nemotron-3-super was originally the Ollama-blob-sourced
; copy, which src/llama-ollama-compat.cpp now refuses to load instead of
; translating (docs/gb10/ollama-compat.md). The model path below points at
; the replacement standard-format GGUF from
; https://huggingface.co/unsloth/NVIDIA-Nemotron-3-Super-120B-A12B-GGUF
; (UD-Q4_K_XL, 3 shards -- point at shard 1, llama.cpp finds the rest).
; This only works once that file is actually downloaded to the path below
; on each host -- the old blob is not deleted automatically. Verify
; whether this GGUF embeds its own chat template before removing
; chat-template-file below (kept here since the override is harmless
; either way).

version = 1

[*]
ctx-size           = 262144
n-gpu-layers       = 99
load-mode          = none
threads            = 8
temp               = 1.0
top-p              = 0.95
min-p              = 0.01
reasoning-preserve = true

[nemotron-3-super]
model              = /home/zbrad/models/nemotron3-gguf/NVIDIA-Nemotron-3-Super-120B-A12B-UD-Q4_K_XL-00001-of-00003.gguf
chat-template-file = /home/zbrad/gh/llama.cpp/models/templates/NVIDIA-Nemotron-3-Super-120B-A12B.jinja
; long-context agent-loop settings; n-gpu-layers=99 above already offloads
; every layer (super has far fewer than 99).
context-shift      = true
flash-attn         = on
cache-type-k       = q8_0
cache-type-v       = q5_0

[nemotron-3-nano]
model              = /home/zbrad/models/nemotron3-gguf/Nemotron-3-Nano-30B-A3B-UD-Q8_K_XL.gguf
; no chat-template-file: this GGUF carries its own embedded template.
