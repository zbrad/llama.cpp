# devices/rtx40-win.conf -- hardware facts for NVIDIA RTX 40-series (Ada
# Lovelace, SM 89) built natively on Windows, shared by every consumer. Sourced
# by the consumer's tuned/env.sh; do not execute. See devices/gb10.conf for the
# rules (no per-repo overrides, key meanings).
#
# Same GPU and same CPU architecture as devices/rtx40.conf; the variant differs
# only because the host OS does, exactly as rtx50-win differs from rtx50 (see
# devices/rtx50-win.conf). The device code is the same sm_89 either way; only
# the host object format (PE instead of ELF) differs.
#
# Added 2026-11-13 at the user's say-so (native rtx40-win on geo-a-node-rtx40-1,
# repeating the rtx50-win stack there). Not yet buildable by the bash scripts,
# for the same reason as rtx50-win: no consumer has a scripted native-Windows
# build path yet, and GPU_TUNED_HOST_OS stops the bash scripts accepting it.

GPU_TUNED_VARIANT="rtx40-win"
GPU_TUNED_PLATFORM="x86_64"
GPU_TUNED_HOST_OS="windows"
GPU_TUNED_CUDA_ARCH="89"
GPU_TUNED_HW_LABEL="RTX 4080/4090 (Ada Lovelace, SM 89), Windows"
