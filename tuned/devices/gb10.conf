# tuned/devices/gb10.conf — device metadata for NVIDIA GB10 (DGX Spark)
# Sourced by tuned/env.sh; do not execute directly.

GPU_TUNED_VARIANT="gb10"
GPU_TUNED_PLATFORM="aarch64"
# CMake's CUDA_ARCHITECTURES accepts the bare arch "121" and auto-upgrades
# it to "121a" (Blackwell family-specific/accelerated variant) itself --
# confirmed via CMake's own configure-log message ("Replacing 121 in
# CMAKE_CUDA_ARCHITECTURES with 121a") when building this repo with
# -DCMAKE_CUDA_ARCHITECTURES=121, per docs/gb10/README.md. GPU_TUNED_CUDA_ARCH
# here is the *resolved* value (matches what cuobjdump actually reports),
# consistent with the other repos in the tuned-builds chain (cuvs/raft/
# faiss/flashinfer/vllm/pytorch all use "121a", not bare "121").
GPU_TUNED_CUDA_ARCH="121a"
GPU_TUNED_HW_LABEL="NVIDIA GB10 (DGX Spark, Blackwell, SM 12.1 accelerated)"
GPU_TUNED_DEVICE_LABEL="gb10"
